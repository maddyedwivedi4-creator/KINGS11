<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KINGS11 — Cricket</title>
<style>
*{box-sizing:border-box}
:root{--bg:#07111f;--card:#0d1b2d;--card2:#10233a;--text:#f5f8ff;--muted:#9fb0c6;--line:#1d3048;--accent:#19d37a;--danger:#ff5263;--gold:#f5c451}
body{margin:0;background:linear-gradient(180deg,#06101d,#081525 55%,#06101d);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;z-index:10;background:rgba(6,16,29,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:15px 16px}
.brand{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:25px;font-weight:900;letter-spacing:.7px}.logo span{color:var(--accent)}
.sub{font-size:11px;color:var(--muted);margin-top:2px}
.wallet{background:var(--card);border:1px solid var(--line);padding:8px 11px;border-radius:12px;font-weight:800;font-size:13px}
.tabs{display:flex;gap:8px;padding:14px 16px 8px;position:sticky;top:72px;z-index:9;background:rgba(6,16,29,.92);backdrop-filter:blur(12px)}
.tab{flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:11px 6px;border-radius:12px;font-weight:800;cursor:pointer}
.tab.active{background:var(--accent);color:#04130b;border-color:var(--accent)}
.content{padding:10px 16px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}
.section-title h2{font-size:18px;margin:0}.refresh{color:var(--muted);font-size:12px}
.status{padding:11px 12px;border:1px solid var(--line);background:var(--card);border-radius:12px;color:var(--muted);font-size:13px;margin-bottom:12px}
.match{background:linear-gradient(145deg,var(--card),#0b1829);border:1px solid var(--line);border-radius:18px;margin:12px 0;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.match-top{padding:13px 14px;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.series{font-size:11px;color:var(--muted);font-weight:700;line-height:1.4}.badge{font-size:10px;font-weight:900;padding:5px 8px;border-radius:999px;background:#172941;color:#b9c8dc}.live{background:rgba(255,82,99,.14);color:#ff7180}
.teams{padding:15px 14px}
.team{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;margin:9px 0}
.team img{width:36px;height:36px;border-radius:50%;object-fit:contain;background:#fff;padding:3px}.team .name{font-weight:850}.team .score{font-weight:900;text-align:right}
.meta{font-size:11px;color:var(--muted);margin-top:8px}
.actions{display:flex;gap:9px;padding:0 14px 14px}
.btn{flex:1;border:0;border-radius:11px;padding:11px 8px;font-weight:900;cursor:pointer}
.join{background:var(--accent);color:#03140b}.details{background:#172941;color:#fff;border:1px solid #29415f}
.empty{text-align:center;padding:45px 15px;color:var(--muted)}
.loader{padding:28px;text-align:center;color:var(--muted)}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(6,16,29,.97);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bottom-inner{max-width:728px;margin:auto;display:flex;justify-content:space-around;color:var(--muted);font-size:11px;font-weight:800}.bottom-item{text-align:center}.bottom-icon{font-size:18px;margin-bottom:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:flex-end}
.modal.show{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#0a1728;border:1px solid var(--line);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto}
.sheet-head{padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0a1728;z-index:2}.close{float:right;background:#182b43;color:#fff;border:0;border-radius:9px;padding:7px 10px;cursor:pointer}
.sheet-body{padding:16px}.detail-score{font-size:24px;font-weight:950;margin:12px 0}.block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}.block h3{margin:0 0 9px;font-size:14px}.kv{display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:12px;margin:7px 0}.kv b{color:var(--text);text-align:right}
.credit-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.credit{background:#14263d;border:1px solid #29415f;color:#fff;border-radius:11px;padding:11px 5px;font-weight:900;cursor:pointer}.credit.selected{border-color:var(--accent);background:rgba(25,211,122,.12)}
@media(min-width:700px){.modal{align-items:center;padding:20px}.sheet{border-radius:22px;max-height:82vh}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div><div class="logo">KINGS<span>11</span> 🏏</div><div class="sub">CRICKET • VIRTUAL CREDITS</div></div>
    <div class="wallet">VC <span id="balance">0</span></div>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="LIVE">🔴 LIVE</button>
  <button class="tab" data-tab="UPCOMING">🗓️ UPCOMING</button>
  <button class="tab" data-tab="COMPLETED">✅ COMPLETED</button>
</nav>

<main class="content">
  <div id="status" class="status">Connecting to KINGS11 cricket server…</div>
  <div class="section-title"><h2 id="sectionTitle">Live Matches</h2><span id="lastUpdated" class="refresh"></span></div>
  <div id="matches"><div class="loader">Loading cricket data…</div></div>
</main>
</div>

<div class="bottom"><div class="bottom-inner">
  <div class="bottom-item"><div class="bottom-icon">🏠</div>Home</div>
  <div class="bottom-item"><div class="bottom-icon">🏏</div>Matches</div>
  <div class="bottom-item"><div class="bottom-icon">👤</div>Profile</div>
</div></div>

<div id="modal" class="modal">
 <div class="sheet">
  <div class="sheet-head"><button class="close" onclick="closeModal()">✕</button><b id="modalTitle">Match Details</b></div>
  <div class="sheet-body" id="modalBody"></div>
 </div>
</div>

<script>
const API="https://kings11-criclive.maddye-dwivedi4.workers.dev";
let currentTab="LIVE", cache={LIVE:[],UPCOMING:[],COMPLETED:[]};

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const pick=(o,keys,def="")=>{for(const k of keys){let v=o?.[k];if(v!==undefined&&v!==null&&v!=="")return v}return def};
const arr=o=>Array.isArray(o)?o:(o?.data&&Array.isArray(o.data)?o.data:o?.matches||o?.results||o?.response||[]);

function arr(o){
 // CricLive may wrap matches at different nesting levels depending on endpoint/version.
 // First check common containers, then recursively search for the first array that
 // actually looks like a match list.
 const looksLikeMatch=(x)=>{
   if(!x || typeof x!=="object" || Array.isArray(x)) return false;
   return ["match_id","matchId","id","match_desc","match_name","first_team",
           "second_team","home_team","away_team","status","match_status",
           "state"].some(k=>k in x);
 };
 const walk=(v,depth=0)=>{
   if(depth>7 || v==null) return [];
   if(Array.isArray(v)){
     if(v.some(looksLikeMatch)) return v;
     for(const item of v){
       const r=walk(item,depth+1);
       if(r.length) return r;
     }
     return [];
   }
   if(typeof v!=="object") return [];
   const preferred=["data","matches","results","response","fixtures","schedule",
                    "match_list","matchList","items","records","events"];
   for(const k of preferred){
     if(k in v){
       const r=walk(v[k],depth+1);
       if(r.length) return r;
     }
   }
   for(const k of Object.keys(v)){
     if(preferred.includes(k)) continue;
     const r=walk(v[k],depth+1);
     if(r.length) return r;
   }
   return [];
 };
 return walk(o);
}

function normalize(raw){
 const a=arr(raw);
 return a.map((m,i)=>{
   const home=m.first_team||m.home_team||m.homeTeam||m.team1||m.home||m.teams?.home||{};
   const away=m.second_team||m.away_team||m.awayTeam||m.team2||m.away||m.teams?.away||{};
   const hs=m.home_score||m.homeScore||m.first_team?.score||m.score?.home||m.scores?.home||{};
   const as=m.away_score||m.awayScore||m.second_team?.score||m.score?.away||m.scores?.away||{};
   const teamName=(t,fallback)=>typeof t==="string"?t:pick(t,["full_name","name","team_name","title"],fallback);
   const teamLogo=(t,fallback="")=>typeof t==="object"?pick(t,["logo","logo_url","image","team_logo"],fallback):fallback;
   return {
    raw:m,
    id:pick(m,["match_id","matchId","id"],i),
    title:pick(m,["match_desc","match_name","title","name"],"Cricket Match"),
    series:pick(m,["series_name","series","tournament"],""),
    status:pick(m,["state","status","match_status"],""),
    start:pick(m,["start_time","startTime","start_datetime","start_date","date_start","match_date","date","scheduled_at","scheduled_time"],""),
    venue:pick(m,["venue","venue_name","ground"],""),
    home:{name:teamName(home,pick(m,["home_team_name","team1_name"],"Team 1")),logo:teamLogo(home,pick(m,["home_logo","team1_logo"],""))},
    away:{name:teamName(away,pick(m,["away_team_name","team2_name"],"Team 2")),logo:teamLogo(away,pick(m,["away_logo","team2_logo"],""))},
    homeScore:scoreText(hs,m,"home"),awayScore:scoreText(as,m,"away")
   };
 });
}

function scoreText(s,m,side){
 if(typeof s==="string"||typeof s==="number") return String(s);
 const score=pick(s,["display","score","runs"],"");
 const wk=pick(s,["wickets","wkt"],"");
 const ov=pick(s,["overs","over"],"");
 if(score!=="" && (wk!==""||ov!=="")) return `${score}${wk!==""?"/"+wk:""}${ov!==""?" ("+ov+")":""}`;
 return score||pick(m,[side+"_score_display",side+"Score"],"");
}

function isLive(m){
 const s=String(m.status).toLowerCase();
 return s.includes("live")||s.includes("in progress")||s.includes("in_progress")||s.includes("started");
}
function isCompleted(m){
 const s=String(m.status).toLowerCase();
 return s.includes("complete")||s.includes("finished")||s.includes("result")||s.includes("ended")||s.includes("abandoned");
}
function isFuture(m){
 const s=String(m.status).toLowerCase();
 if(isLive(m)||isCompleted(m)) return false;
 return s.includes("preview")||s.includes("scheduled")||s.includes("upcoming")||s.includes("not started")||s.includes("fixture")||s.includes("yet to start")||(!isLive(m)&&!isCompleted(m));
}
function logo(url,name){
 return url?`<img src="${esc(url)}" alt="" onerror="this.style.display='none'">`:`<div style="width:36px;height:36px;border-radius:50%;background:#172941;display:grid;place-items:center;font-size:18px">🏏</div>`;
}
function formatDate(v){
 if(!v)return "";
 const d=new Date(v); if(Number.isNaN(d.getTime()))return String(v);
 return d.toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
}

function card(m){
 const live=isLive(m);
 return `<article class="match">
  <div class="match-top"><div class="row"><div class="series">${esc(m.series||m.title)}</div><span class="badge ${live?"live":""}">${live?"● LIVE":esc(m.status||"UPCOMING")}</span></div></div>
  <div class="teams">
   <div class="team">${logo(m.home.logo,m.home.name)}<div class="name">${esc(m.home.name)}</div><div class="score">${esc(m.homeScore)}</div></div>
   <div class="team">${logo(m.away.logo,m.away.name)}<div class="name">${esc(m.away.name)}</div><div class="score">${esc(m.awayScore)}</div></div>
   <div class="meta">${esc(m.title)}${m.start?" • "+esc(formatDate(m.start)):""}${m.venue?" • "+esc(m.venue):""}</div>
  </div>
  <div class="actions">
   <button class="btn join" onclick="joinMatch('${encodeURIComponent(String(m.id))}')">JOIN NOW</button>
   <button class="btn details" onclick="details('${encodeURIComponent(String(m.id))}')">MATCH DETAILS</button>
  </div>
 </article>`;
}

function render(){
 const list=cache[currentTab]||[];
 $("sectionTitle").textContent=currentTab==="LIVE"?"Live Matches":currentTab==="UPCOMING"?"Upcoming Matches":"Completed Matches";
 if(!list.length){$("matches").innerHTML=`<div class="empty">No ${currentTab.toLowerCase()} cricket matches available right now.</div>`;return}
 $("matches").innerHTML=list.map(card).join("");
}

async function fetchJSON(path){
 const r=await fetch(API+path,{cache:"no-store"});
 const j=await r.json();
 if(!r.ok||j.success===false)throw new Error(j.error||j.message||("HTTP "+r.status));
 return j;
}

function mergeUnique(list){
 const seen=new Set();
 return list.filter(m=>{
   const key=String(m.id);
   if(seen.has(key)) return false;
   seen.add(key);
   return true;
 });
}

async function load(){
 $("status").textContent="Updating real cricket data from CricLive…";
 try{
   const [liveRaw,scheduleRaw]=await Promise.all([
     fetchJSON("/api/cricket/live"),
     fetchJSON("/api/cricket/schedule")
   ]);

   const liveAll=normalize(liveRaw);
   const schedule=normalize(scheduleRaw);

   // /live can contain both actual LIVE matches and PREVIEW/future matches.
   // /schedule is used as the main upcoming/completed source.
   cache.LIVE=liveAll.filter(isLive);

   const futureFromLive=liveAll.filter(isFuture);
   const futureFromSchedule=schedule.filter(isFuture);
   cache.UPCOMING=mergeUnique([...futureFromLive,...futureFromSchedule]);

   cache.COMPLETED=mergeUnique(schedule.filter(isCompleted));

   $("status").textContent=`CricLive connected • ${cache.LIVE.length} live • ${cache.UPCOMING.length} upcoming`;
   $("lastUpdated").textContent=new Date().toLocaleTimeString("en-IN");
   render();
 }catch(e){
   $("status").textContent="Cricket server connection error: "+e.message;
   $("matches").innerHTML=`<div class="empty">Data could not be loaded. Check the KINGS11 Worker.</div>`;
 }
}

function findMatch(id){
 return [...cache.LIVE,...cache.UPCOMING,...cache.COMPLETED].find(m=>String(m.id)===String(id));
}

async function details(encoded){
 const id=decodeURIComponent(encoded),m=findMatch(id); if(!m)return;
 $("modalTitle").textContent=`${m.home.name} vs ${m.away.name}`;
 $("modalBody").innerHTML=`<div class="detail-score">${esc(m.home.name)} ${m.homeScore?" "+esc(m.homeScore):""}<br><span style="color:#8094ae;font-size:14px">vs</span><br>${esc(m.away.name)} ${m.awayScore?" "+esc(m.awayScore):""}</div>
 <div class="block"><h3>Match</h3><div class="kv"><span>Series</span><b>${esc(m.series||"-")}</b></div><div class="kv"><span>Status</span><b>${esc(m.status||"-")}</b></div><div class="kv"><span>Start</span><b>${esc(formatDate(m.start)||"-")}</b></div><div class="kv"><span>Venue</span><b>${esc(m.venue||"-")}</b></div></div>
 <div class="block"><h3>Live details</h3><div id="detailExtra">Loading scorecard/commentary…</div></div>`;
 $("modal").classList.add("show");
 try{
   const [sc,com]=await Promise.all([
     fetchJSON(`/api/cricket/match/${encodeURIComponent(id)}/scorecard`),
     fetchJSON(`/api/cricket/match/${encodeURIComponent(id)}/commentary`)
   ]);
   $("detailExtra").innerHTML=`<div class="kv"><span>Scorecard</span><b>Available</b></div><div class="kv"><span>Commentary</span><b>Available</b></div><pre style="white-space:pre-wrap;font-size:10px;color:#9fb0c6;max-height:260px;overflow:auto">${esc(JSON.stringify(com.data||com,null,2).slice(0,5000))}</pre>`;
 }catch(e){$("detailExtra").textContent="Detailed data is not available for this match yet."}
}
function closeModal(){$("modal").classList.remove("show")}
function joinMatch(encoded){
 const id=decodeURIComponent(encoded),m=findMatch(id);
 if(!m)return;
 $("modalTitle").textContent="JOIN MATCH";
 $("modalBody").innerHTML=`<div style="font-weight:900;font-size:18px">${esc(m.home.name)} vs ${esc(m.away.name)}</div><p style="color:#9fb0c6;font-size:12px">Virtual credits only. Login/Wallet integration will be connected in the next version.</p><div class="block"><h3>Select VC</h3><div class="credit-options">${["1K","1.5K","2K","5K","10K"].map((x,i)=>`<button class="credit ${i===0?"selected":""}" onclick="selectCredit(this)">${x} VC</button>`).join("")}</div></div><button class="btn join" style="width:100%;margin-top:10px" onclick="alert('Wallet/login will be connected next.')">CONTINUE</button>`;
 $("modal").classList.add("show");
}
function selectCredit(el){document.querySelectorAll(".credit").forEach(x=>x.classList.remove("selected"));el.classList.add("selected")}

document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentTab=b.dataset.tab;render()}));
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
load();
setInterval(load,60000);
</script>
</body>
</html>
